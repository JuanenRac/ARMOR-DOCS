# Copyright (C) 2026 JuanenRac (Electro Hobby 3D). GPL-3.0-or-later.
#
# Builds the site from the documents that are already public (tools/make_site.py) and keeps it as a build artifact. It is run by hand; nothing is published from here.
name: Documentation site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  site:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ARMOR-DOCS

      - name: Fetch the shared contracts next to it
        run: git clone --depth 1 https://github.com/JuanenRac/ARMOR-COMMON.git ARMOR-COMMON

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the site and check it for anything that must not go public
        working-directory: ARMOR-DOCS
        run: |
          python -m pip install --quiet pyyaml
          python tools/make_site.py --check
          python tools/make_site.py

      - name: Keep the site as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: ARMOR-DOCS/site
          if-no-files-found: error
